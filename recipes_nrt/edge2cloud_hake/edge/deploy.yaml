flow_start_time: # use ISO8601 format: if UTC use +00:00 or Z

source:
  mode: local

default_work_pool_name: local

flows:
  # Simulation flows to generate acoustic and trawl data ================
  copy_raw:
    deployment_name: copy-raw
    interval: 5
    inject_time_offset: true

  copy_trawl:
    deployment_name: copy-trawl
    interval: 20

  # Actual flows ========================================================
  raw2Sv:
    deployment_name: raw2Sv
    deployment_concurrency:
      limit: 1
      collision_strategy: CANCEL_NEW
    interval: 5

  create_MVBS:
    deployment_name: create-MVBS
    interval: 10
    cron_offset: 3

  classify_backscatter:
    deployment_name: classify-backscatter
    interval: 20

  file_upload_acoustics:
    deployment_name: file-upload-acoustics
    flow: file_upload
    interval: 10
    cron_offset: 3

  file_upload_trawl:
    deployment_name: file-upload-trawl
    flow: file_upload
    interval: 10
