flows:
  # TESTING -- copy_raw and raw2Sv pair
  copy_raw:
    path_raw_list: PATH_OF_PROJECT/SH2407_raw_list_organized.csv
    path_copy: PATH_OF_PROJECT/raw
    s3_bucket: noaa-wcsd-pds
    exclude_before: "2024-07-07T00:00:00+00"  # use ISO8601 format: if UTC use +00:00 or Z
  raw2Sv:
    exclude_before: "2024-07-07T00:00:00+00:00"  # use ISO8601 format: if UTC use +00:00 or Z
    exclude_raw_file: []
    parallel: False
    encode_mode: power
    waveform_mode: CW
    depth_offset: 7
    sonar_model: EK80
    nmea_sentence: GGA
    filename_pattern: "Hake-*.raw"
    path_raw: PATH_OF_PROJECT/raw
    path_main: PATH_OF_PROJECT/local_data_main
    file_Sv_csv: Sv_files.csv
  #
  # TESTING -- create_MVBS
  create_MVBS:
    slice_mins: 20
    num_slices: 3
    range_bin: 1m
    ping_time_bin: 5s
    path_main: PATH_OF_PROJECT/local_data_main
    file_Sv_csv: Sv_files.csv
    file_MVBS_csv: MVBS_files.csv
  #
  # TESTING -- predict_hake
  predict_hake:
    slice_mins: 40
    num_slices: 3
    temperature: 0.5
    softmax_threshold: 0.5
    max_depth: 590.0
    path_weight: PATH_OF_PROJECT/model_weights/binary_hake_model_1.0m_bottom_offset_1.0m_depth_2017_2019_epoch_080.ckpt
    path_main: PATH_OF_PROJECT/local_data_main
    file_MVBS_csv: MVBS_files.csv
    file_prediction_csv: prediction_files.csv

