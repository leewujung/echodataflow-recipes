flow_start_time: "2024-07-07T00:30:00+00:00" # time travel for testing or reprocessing
                # use ISO8601 format: if UTC use +00:00 or Z

source:
  mode: local
  git:
    url: https://github.com/echostack-org/echodataflow.git
    branch: origin/main

default_work_pool_name: local
flows:
  copy_raw:
    module: flows_helper
    deployment_name: copy_raw
    interval: 10
    inject_time_offset: true
  copy_trawl_data:
    module: flows_helper
    deployment_name: copy-trawl-data
    interval: 10
  file_upload_trawl:
    module: flows_helper
    deployment_name: file-upload-trawl
    flow_alias: file_upload
    interval: 10
    cron_offset: 3
